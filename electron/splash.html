<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FBEM Studio — Khởi động</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at top center, #131d36 0%, #080c14 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      margin-bottom: 28px;
    }
    .glow-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(59, 130, 246, 0) 70%);
      border-radius: 50%;
      animation: pulse 2.5s infinite alternate ease-in-out;
    }
    .logo-icon {
      font-size: 52px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.6));
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 32px;
      letter-spacing: 0.2px;
    }
    .spinner-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 22px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status-text {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="glow-circle"></div>
    <div class="logo-icon">⚡</div>
  </div>
  <h1>FBEM Studio</h1>
  <p class="subtitle">Facebook Automation & Control Center</p>
  <div class="spinner-wrapper">
    <div class="spinner"></div>
    <span class="status-text" id="status">Đang khởi động Server Bridge & Bot...</span>
  </div>
</body>
</html>
